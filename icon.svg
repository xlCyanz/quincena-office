  <circle cx="94" cy="32" r="18" fill="#ffcf40"/>
  <circle cx="94" cy="32" r="13" fill="none" stroke="#e0a800" stroke-width="2"/>
  <path d="M100 26 Q94 21 88 25 Q84 30 94 32 Q104 34 100 39 Q94 44 87 38" fill="none" stroke="#8a5a00" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="94" y1="19" x2="94" y2="45" stroke="#8a5a00" stroke-width="3" stroke-linecap="round"/>
</svg>
