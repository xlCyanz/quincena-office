<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Icono de Quincena Office: un puesto de trabajo isométrico y la moneda de la quincena. -->
  <rect x="2" y="2" width="124" height="124" rx="16" fill="#26324a" stroke="#141b2b" stroke-width="4"/>
  <!-- Piso -->
  <polygon points="64,44 116,70 64,96 12,70" fill="#c9a66b"/>
  <polygon points="64,44 90,57 64,70 38,57" fill="#d8b77c"/>
  <polygon points="90,57 116,70 90,83 64,70" fill="#d8b77c"/>
  <polygon points="38,83 64,70 90,83 64,96" fill="#d8b77c"/>
  <polygon points="12,70 38,57 64,70 38,83" fill="#d8b77c"/>
  <!-- Escritorio -->
  <polygon points="40,66 64,54 88,66 64,78" fill="#9a6a3c"/>
  <polygon points="40,66 64,78 64,86 40,74" fill="#6e4826"/>
  <polygon points="64,78 88,66 88,74 64,86" fill="#5a3a1e"/>
